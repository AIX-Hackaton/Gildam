          title: Durationmaxminutes
        walkingMinutes:
          type: integer
          title: Walkingminutes
        transferCount:
          type: integer
          title: Transfercount
        roundTripTransitMinutes:
          type: integer
          title: Roundtriptransitminutes
        verificationStatus:
          type: string
          title: Verificationstatus
        exposureTier:
