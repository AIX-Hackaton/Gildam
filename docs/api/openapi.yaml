openapi: 3.1.0
info:
  title: Gildam API
  version: 0.1.0
  description: >
    길담 MVP의 프론트엔드와 백엔드 간 API 계약입니다.
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: API server is healthy.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    example: ok
  /api/courses/{courseId}:
    get:
      summary: 추천 코스 상세 조회
      description: >
        검증된 코스 DB에서 코스 상세 정보를 조회하고, 이동 피로도와
        Kakao 지도 링크를 포함해 반환합니다.
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
          example: damyang-slow-walk
      responses:
        "200":
          description: Course detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseDetail"
        "404":
          description: Course not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/recommendations:
    post:
      summary: 추천 목록 조회
      description: >
        사용자의 출발지, 가능 시간, 취향을 기준으로 코스를 필터링하고
        이동 피로도와 취향 점수를 계산해 추천 목록을 반환합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecommendationRequest"
            example:
              departure: GWANGJU_SONGJEONG
              duration: FULL_DAY
              preferences:
                - NATURE_WALK
                - FOOD_MARKET
      responses:
        "200":
          description: Ranked recommendation list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationResponse"
        "422":
          description: Invalid recommendation request.
components:
  schemas:
    ErrorResponse:
      type: object
      required:
        - detail
      properties:
        detail:
          type: string
          example: Course not found.
    RecommendationRequest:
      type: object
      required:
        - departure
        - duration
        - preferences
      properties:
        departure:
          type: string
          enum:
            - GWANGJU_SONGJEONG
            - USQUARE
        duration:
          type: string
          enum:
            - SIX_HOURS
            - FULL_DAY
        preferences:
          type: array
          minItems: 1
          items:
            type: string
            enum:
              - NATURE_WALK
              - HISTORY_CULTURE
              - FOOD_MARKET
              - MEMORY
    RecommendationResponse:
      type: object
      required:
        - courses
        - exclusions
      properties:
        courses:
          type: array
          items:
            $ref: "#/components/schemas/CourseRecommendation"
        exclusions:
          type: array
          items:
            $ref: "#/components/schemas/ExcludedCourse"
    CourseRecommendation:
      allOf:
        - $ref: "#/components/schemas/CourseSummary"
        - type: object
          required:
            - fatigueScore
            - roundTripTransitMinutes
            - recommendationScore
            - scoreBreakdown
          properties:
            fatigueScore:
              type: number
            roundTripTransitMinutes:
              type: integer
            recommendationScore:
              type: number
            scoreBreakdown:
              $ref: "#/components/schemas/RecommendationScoreBreakdown"
    CourseSummary:
      type: object
      required:
        - id
        - title
        - region
        - thumbnailUrl
        - tags
        - fatigueLevel
        - durationMinutes
        - walkingMinutes
        - transferCount
        - recommendationReasons
      properties:
        id:
          type: string
        title:
          type: string
        region:
          type: string
        thumbnailUrl:
          type: string
        tags:
          type: array
          items:
            type: string
        fatigueLevel:
          type: string
          enum:
            - LOW
            - MEDIUM
            - HIGH
        durationMinutes:
          type: integer
        walkingMinutes:
          type: integer
        transferCount:
          type: integer
        recommendationReasons:
          type: array
          items:
            type: string
    RecommendationScoreBreakdown:
      type: object
      required:
        - preferenceMatch
        - mobility
        - localResource
        - recordFit
      properties:
        preferenceMatch:
          $ref: "#/components/schemas/PreferenceMatchScoreFactor"
        mobility:
          $ref: "#/components/schemas/MobilityScoreFactor"
        localResource:
          $ref: "#/components/schemas/RecommendationScoreFactor"
        recordFit:
          $ref: "#/components/schemas/RecommendationScoreFactor"
    RecommendationScoreFactor:
      type: object
      required:
        - score
        - weight
        - weightedScore
      properties:
        score:
          type: number
        weight:
          type: number
        weightedScore:
          type: number
    PreferenceMatchScoreFactor:
      allOf:
        - $ref: "#/components/schemas/RecommendationScoreFactor"
        - type: object
          required:
            - matchedCount
            - selectedCount
            - matchedPreferences
          properties:
            matchedCount:
              type: integer
            selectedCount:
              type: integer
            matchedPreferences:
              type: array
              items:
                type: string
    MobilityScoreFactor:
      allOf:
        - $ref: "#/components/schemas/RecommendationScoreFactor"
        - type: object
          required:
            - fatigueScore
          properties:
            fatigueScore:
              type: number
    ExcludedCourse:
      type: object
      required:
        - id
        - title
        - reasons
      properties:
        id:
          type: string
        title:
          type: string
        reasons:
          type: array
          items:
            $ref: "#/components/schemas/ExclusionReason"
    ExclusionReason:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - UNSUPPORTED_DEPARTURE
            - TIME_LIMIT_EXCEEDED
            - RETURN_NOT_FEASIBLE
        message:
          type: string
    CourseDetail:
      type: object
      required:
        - id
        - title
        - region
        - thumbnailUrl
        - tags
        - fatigueLevel
        - fatigueScore
        - durationMinutes
        - walkingMinutes
        - transferCount
        - roundTripTransitMinutes
        - recommendationReasons
        - description
        - itinerary
        - localFood
        - localPoints
        - scenePrompts
        - primaryDestination
        - mapUrl
        - directionsUrl
        - kakaoMapUrl
        - kakaoDirectionsUrl
      properties:
        id:
          type: string
        title:
          type: string
        region:
          type: string
        thumbnailUrl:
          type: string
        tags:
          type: array
          items:
            type: string
        fatigueLevel:
          type: string
          enum:
            - LOW
            - MEDIUM
            - HIGH
        fatigueScore:
          type: number
        durationMinutes:
          type: integer
        walkingMinutes:
          type: integer
        transferCount:
          type: integer
        roundTripTransitMinutes:
          type: integer
        recommendationReasons:
          type: array
          items:
            type: string
        description:
          type: string
        itinerary:
          type: array
          items:
            $ref: "#/components/schemas/ItineraryItem"
        localFood:
          type: array
          items:
            $ref: "#/components/schemas/LocalFood"
        localPoints:
          type: array
          items:
            $ref: "#/components/schemas/LocalPoint"
        scenePrompts:
          type: array
          items:
            type: string
        primaryDestination:
          $ref: "#/components/schemas/CourseDestination"
        mapUrl:
          type: string
          format: uri
        directionsUrl:
          type: string
          format: uri
        kakaoMapUrl:
          type: string
          format: uri
        kakaoDirectionsUrl:
          type: string
          format: uri
    ItineraryItem:
      type: object
      required:
        - id
        - name
        - type
      properties:
        id:
          type: string
        time:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
            - transport
            - place
            - food
        durationMinutes:
          type: integer
        note:
          type: string
    LocalFood:
      type: object
      required:
        - id
        - name
        - description
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
    LocalPoint:
      type: object
      required:
        - id
        - title
        - description
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
    CourseDestination:
      type: object
      required:
        - name
        - latitude
        - longitude
      properties:
        name:
          type: string
        latitude:
          type: number
        longitude:
          type: number
