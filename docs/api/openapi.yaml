          title: Id
        name:
          type: string
          title: Name
        description:
          type: string
          title: Description
        tags:
          items:
            type: string
          type: array
          title: Tags
      type: object
      required:
      - id
      - name
      - description
      title: LocalFood
    LocalPoint:
      properties:
        id:
