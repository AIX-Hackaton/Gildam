openapi: 3.1.0
info:
  title: Gildam API
  version: 0.1.0
  description: >
    길담 MVP의 프론트엔드와 백엔드 간 API 계약입니다.
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: API server is healthy.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    example: ok
  /api/courses/{courseId}:
    get:
      summary: 추천 코스 상세 조회
      description: >
        검증된 코스 DB에서 코스 상세 정보를 조회하고, 이동 피로도와
        Kakao 지도 링크를 포함해 반환합니다.
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
          example: damyang-slow-walk
      responses:
        "200":
          description: Course detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseDetail"
        "404":
          description: Course not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    ErrorResponse:
      type: object
      required:
        - detail
      properties:
        detail:
          type: string
          example: Course not found.
    CourseDetail:
      type: object
      required:
        - id
        - title
        - region
        - thumbnailUrl
        - tags
        - fatigueLevel
        - fatigueScore
        - durationMinutes
        - walkingMinutes
        - transferCount
        - roundTripTransitMinutes
        - recommendationReasons
        - description
        - itinerary
        - localFood
        - localPoints
        - scenePrompts
        - primaryDestination
        - mapUrl
        - directionsUrl
        - kakaoMapUrl
        - kakaoDirectionsUrl
      properties:
        id:
          type: string
        title:
          type: string
        region:
          type: string
        thumbnailUrl:
          type: string
        tags:
          type: array
          items:
            type: string
        fatigueLevel:
          type: string
          enum:
            - LOW
            - MEDIUM
            - HIGH
        fatigueScore:
          type: number
        durationMinutes:
          type: integer
        walkingMinutes:
          type: integer
        transferCount:
          type: integer
        roundTripTransitMinutes:
          type: integer
        recommendationReasons:
          type: array
          items:
            type: string
        description:
          type: string
        itinerary:
          type: array
          items:
            $ref: "#/components/schemas/ItineraryItem"
        localFood:
          type: array
          items:
            $ref: "#/components/schemas/LocalFood"
        localPoints:
          type: array
          items:
            $ref: "#/components/schemas/LocalPoint"
        scenePrompts:
          type: array
          items:
            type: string
        primaryDestination:
          $ref: "#/components/schemas/CourseDestination"
        mapUrl:
          type: string
          format: uri
        directionsUrl:
          type: string
          format: uri
        kakaoMapUrl:
          type: string
          format: uri
        kakaoDirectionsUrl:
          type: string
          format: uri
    ItineraryItem:
      type: object
      required:
        - id
        - name
        - type
      properties:
        id:
          type: string
        time:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
            - transport
            - place
            - food
        durationMinutes:
          type: integer
        note:
          type: string
    LocalFood:
      type: object
      required:
        - id
        - name
        - description
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
    LocalPoint:
      type: object
      required:
        - id
        - title
        - description
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
    CourseDestination:
      type: object
      required:
        - name
        - latitude
        - longitude
      properties:
        name:
          type: string
        latitude:
          type: number
        longitude:
          type: number
