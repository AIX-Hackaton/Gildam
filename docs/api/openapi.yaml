          title: Verifieddate
        thumbnailUrl:
          type: string
          title: Thumbnailurl
        tags:
          items:
            type: string
          type: array
          title: Tags
        preferences:
          items:
            type: string
          type: array
          title: Preferences
        fatigueLevel:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
          title: Fatiguelevel
        fatigueScore:
          type: number
          title: Fatiguescore
