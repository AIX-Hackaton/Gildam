# 이 파일은 scripts/export_openapi.py 로 자동 생성됩니다.
# 직접 수정하지 말고 backend/app 의 모델을 고친 뒤 다시 생성해 주세요.
openapi: 3.1.0
info:
  title: Gildam API
  description: 길담 MVP API입니다. 검증된 코스 DB(schema v3.1)를 원천으로 조건 필터링·귀가 가능성 검증·설명 가능한 추천을 제공합니다.
  version: 0.4.0
paths:
  /health:
    get:
      summary: Health Check
      description: 서버 상태와 함께 데이터 정합성 요약을 돌려줍니다.
      operationId: health_check_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Health Check Health Get
  /api/meta/conditions:
    get:
      summary: Read Condition Options
      description: 조건 선택지의 단일 정의. 프론트엔드 하드코딩 드리프트를 막습니다.
      operationId: read_condition_options_api_meta_conditions_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Read Condition Options Api Meta Conditions Get
  /api/meta/data-lineage:
    get:
      summary: Read Data Lineage
      description: 'Track #1 원자료 약속과 실제 시트·코드·화면 사용처를 반환합니다.'
      operationId: read_data_lineage_api_meta_data_lineage_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataLineageResponse'
  /api/tour/search:
    get:
      summary: Search Tour Places
      description: TourAPI keyword search. 서버가 인증키를 보관하고 결과만 정규화합니다.
      operationId: search_tour_places_api_tour_search_get
      parameters:
      - name: keyword
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          title: Keyword
      - name: contentTypeId
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Contenttypeid
      - name: arrange
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 1
          default: A
          title: Arrange
      - name: pageNo
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Pageno
      - name: numOfRows
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 10
          title: Numofrows
      - name: lDongRegnCd
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Ldongregncd
      - name: lDongSignguCd
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Ldongsigngucd
      - name: lclsSystm1
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Lclssystm1
      - name: lclsSystm2
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Lclssystm2
      - name: lclsSystm3
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Lclssystm3
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TourApiListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/tour/nearby:
    get:
      summary: Search Nearby Tour Places
      description: TourAPI location-based search for candidate place matching.
      operationId: search_nearby_tour_places_api_tour_nearby_get
      parameters:
      - name: mapX
        in: query
        required: true
        schema:
          type: number
          title: Mapx
      - name: mapY
        in: query
        required: true
        schema:
          type: number
          title: Mapy
      - name: radius
        in: query
        required: false
        schema:
          type: integer
          maximum: 20000
          minimum: 1
          default: 1000
          title: Radius
      - name: contentTypeId
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Contenttypeid
      - name: arrange
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 1
          default: E
          title: Arrange
      - name: pageNo
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Pageno
      - name: numOfRows
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 10
          title: Numofrows
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TourApiListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/tour/places/{content_id}:
    get:
      summary: Read Tour Place Detail
      description: TourAPI common detail lookup by contentId.
      operationId: read_tour_place_detail_api_tour_places__content_id__get
      parameters:
      - name: content_id
        in: path
        required: true
        schema:
          type: string
          title: Content Id
      - name: pageNo
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Pageno
      - name: numOfRows
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 10
          title: Numofrows
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TourApiListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/courses/{course_id}:
    get:
      summary: Read Course Detail
      operationId: read_course_detail_api_courses__course_id__get
      parameters:
      - name: course_id
        in: path
        required: true
        schema:
          type: string
          title: Course Id
      - name: duration
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Duration
      - name: simulate
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Simulate
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDetailResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/recommendations:
    post:
      summary: Read Recommendations
      operationId: read_recommendations_api_recommendations_post
      parameters:
      - name: simulate
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Simulate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
