# 이 파일은 scripts/export_openapi.py 로 자동 생성됩니다.
# 직접 수정하지 말고 backend/app 의 모델을 고친 뒤 다시 생성해 주세요.
openapi: 3.1.0
info:
  title: Gildam API
  description: 길담 MVP API입니다. 검증된 코스 DB(schema v3.1)를 원천으로 조건 필터링·귀가 가능성 검증·설명 가능한 추천을 제공합니다.
  version: 0.3.0
paths:
  /health:
    get:
      summary: Health Check
      description: 서버 상태와 함께 데이터 정합성 요약을 돌려줍니다.
      operationId: health_check_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Health Check Health Get
  /api/meta/conditions:
    get:
      summary: Read Condition Options
      description: 조건 선택지의 단일 정의. 프론트엔드 하드코딩 드리프트를 막습니다.
      operationId: read_condition_options_api_meta_conditions_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Read Condition Options Api Meta Conditions Get
  /api/courses/{course_id}:
    get:
      summary: Read Course Detail
      operationId: read_course_detail_api_courses__course_id__get
      parameters:
      - name: course_id
        in: path
        required: true
        schema:
          type: string
          title: Course Id
      - name: duration
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Duration
      - name: simulate
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Simulate
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDetailResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/recommendations:
    post:
      summary: Read Recommendations
      operationId: read_recommendations_api_recommendations_post
      parameters:
      - name: simulate
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Simulate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
