name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  required-files:
    name: 필수 문서 확인
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify project guidance
        shell: bash
        run: |
          test -f AGENTS.md
          test -f README.md
          test -f CONTRIBUTING.md
          test -f docs/Gildam_PRODUCT_SPEC.md
          test -f docs/api/openapi.yaml
          test -f docs/DATA_INTEGRATION.md

  backend:
    name: 백엔드 (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Validate course data against schema v3.1
        run: python -m backend.app.courses.schema

      - name: Run tests
        run: python -m unittest discover -s backend/tests -t . -p "test_*.py"

      - name: Check API spec is in sync with the implementation
        run: python scripts/export_openapi.py --check

  frontend:
    name: 프론트엔드 (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build
