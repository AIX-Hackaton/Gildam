name: Repository checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  required-files:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify project guidance
        shell: bash
        run: |
          test -f AGENTS.md
          test -f README.md
          test -f CONTRIBUTING.md
          test -f docs/Gildam_PRODUCT_SPEC.md
          test -f docs/api/openapi.yaml
